[project]
name = "mint"
authors = [
    { name = "The Commit Company (Algocode Technologies Pvt. Ltd.)", email = "support@thecommit.company"}
]
description = "Bank reconciliation made simple for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "google-cloud-documentai"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# //// Neoffice — NOT ours: this block is upstream v1.5.0, brought in by hand with the
# //// CSV importer port (89e7929, Daniel). Our file is byte-identical to upstream/develop
# //// here — at the next merge take upstream's pyproject.toml and drop this marker.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<=17.0.0-dev"
