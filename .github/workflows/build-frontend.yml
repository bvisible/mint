name: build-frontend

on:
  # //// Neoffice — by hand too: a build that failed for a reason unrelated to its source
  # //// (a lost push race, see below) could only be relaunched by pushing again.
  workflow_dispatch:
  push:
    branches: [version-15]
    paths:
      - 'frontend/**'
      - '!**/node_modules/**'
      - '!mint/public/mint/**'
      - '!mint/www/mint.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # Mint frontend/proxyOptions.ts has:
      #   const common_site_config = require('../../../sites/common_site_config.json');
      # That path resolves to <repo-parent>/sites/. Stub it at multiple
      # candidate locations to be safe (esbuild path resolution differs
      # subtly from cjs require).
      - name: Create common_site_config stub
        run: |
          for d in ../sites ./sites; do
            mkdir -p "$d"
            echo '{"socketio_port": 9000, "webserver_port": 8000, "default_site": "prod.local"}' > "$d/common_site_config.json"
          done
          echo "stubs:" && ls -la ../sites ./sites 2>/dev/null

      - name: Install
        run: cd frontend && yarn install --frozen-lockfile

      - name: Build
        run: cd frontend && yarn build

      # Mint writes vite output to public/mint/, not public/frontend/.
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mint/public/mint mint/www/mint.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          # //// Neoffice — rebase and retry. A plain push loses the build whenever another commit
          # //// (the marker bot's, a cockpit pin bump) lands on the branch while this job compiles:
          # //// the push is refused as non-fast-forward and nothing rebuilds that source, so the
          # //// fleet keeps a frontend older than its code (suite, 04.09 to 13.09). A newer frontend
          # //// push cancels this run (concurrency), so whatever landed meanwhile did not touch it.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1
