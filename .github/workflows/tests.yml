name: Tests
# Fleet CI for this product fork (wave 2). Mechanics live in bvisible/neoffice-ci
# (frappe-app-ci.yml): bench init on OUR frappe fork, deps, run-tests, report to
# the hub (one [CI] issue per repo, closed by the green). The fork imports
# neoffice_theme (private): FLEET_READ_TOKEN clones it, like the wave-1 apps.
# Nightly + PR + on demand — not on push: the upstream CI and the build bot
# already run there.
on:
  schedule:
    - cron: "15 5 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      test_args:
        description: "Extra args for bench run-tests (e.g. --debug-records)"
        required: false
        default: ""
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: mint
      install_apps: erpnext,payments,neoffice_theme
      skip_build: true   # SPA commit-the-build: assets committed, never built on instances
      test_args: ${{ inputs.test_args || '' }}
    # inherit: CI_REPORT_SECRET + FLEET_READ_TOKEN (neoffice_theme is private)
    secrets: inherit
